<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Take One">
<title>Take One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: camera fills the phone; script sits in the top band right under the lens so your eyes stay near the camera; controls live at the bottom edge. */
:root{
  --ink:#F4F1EC; --dim:rgba(244,241,236,.55); --glass:rgba(10,10,12,.62); --glass-2:rgba(10,10,12,.85);
  --rec:#FF3B30; --cue:#FFD23F; --line:rgba(255,255,255,.14);
  --sans:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --fs:30px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--cue);outline-offset:2px}

#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
#cam.back{transform:none}

/* script band */
#band{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--glass-2),var(--glass) 75%,rgba(10,10,12,0));z-index:2}
#viewport{position:relative;height:var(--bandh,38vh);overflow:hidden;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px));
  -webkit-mask-image:linear-gradient(transparent 0,#000 14%,#000 80%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 14%,#000 80%,transparent 100%)}
#scroller{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));top:0;will-change:transform}
#scroller p{margin:0 0 .55em;font-size:var(--fs);line-height:1.22;font-weight:700;letter-spacing:-.01em;color:var(--dim);transition:color .15s}
#scroller p.on{color:var(--ink)}
#scroller p .n{font:500 .42em var(--mono);color:var(--cue);vertical-align:.45em;margin-right:.5em;letter-spacing:.06em}
#cue{position:absolute;left:6px;width:6px;height:calc(var(--fs)*1.1);top:28%;border-radius:3px;background:var(--cue);opacity:.9}
#viewport.mirror #scroller{transform-origin:center}

/* status pill */
#status{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--bandh,38vh) + 8px);left:50%;transform:translateX(-50%);z-index:3;
  font:500 13px var(--mono);letter-spacing:.08em;padding:6px 12px;border-radius:999px;background:var(--glass);display:flex;gap:8px;align-items:center}
#status .dot{width:9px;height:9px;border-radius:50%;background:#777}
#status.live .dot{background:var(--rec);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* countdown */
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:30vw;font-weight:800;z-index:6;pointer-events:none;text-shadow:0 4px 40px rgba(0,0,0,.6)}

/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7) 40%)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:12px}
.chip{min-width:44px;height:44px;padding:0 12px;border-radius:12px;background:var(--glass);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.chip small{font:500 11px var(--mono);color:var(--dim);letter-spacing:.06em}
.chip.on{background:var(--ink);color:#111}
#recbtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;flex:none}
#recbtn i{width:58px;height:58px;border-radius:50%;background:var(--rec);transition:all .2s}
#recbtn.live i{width:28px;height:28px;border-radius:7px}
.group{display:flex;gap:8px;align-items:center}
#speedv,#sizev{font:500 13px var(--mono);min-width:3.2ch;text-align:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.sheet h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sheet p.hint{margin:0;color:var(--dim);font-size:14px;line-height:1.4}
#script{flex:1;min-height:0;width:100%;resize:none;border-radius:14px;border:1px solid var(--line);background:#141416;color:var(--ink);padding:14px;font:500 17px/1.45 var(--sans)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:48px;padding:0 18px;border-radius:12px;background:#1d1d20;font-weight:700}
.btn.primary{background:var(--ink);color:#111}
#review video{width:100%;flex:1;min-height:0;border-radius:14px;background:#111;object-fit:contain}
#err{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;text-align:center;background:#000}
#err div{max-width:30rem;display:grid;gap:12px}
#err b{font-size:20px}
#err span{color:var(--dim);line-height:1.45}
@media (prefers-reduced-motion:reduce){#status.live .dot{animation:none}}
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted></video>

<div id="band"><div id="viewport"><div id="cue"></div><div id="scroller"></div></div></div>
<div id="status"><span class="dot"></span><span id="stxt">READY</span></div>
<div id="count" hidden></div>

<div id="bar">
  <div class="row">
    <div class="group">
      <button class="chip" id="modeBtn" aria-label="Switch between scrolling and line-by-line">Scroll</button>
      <button class="chip" id="slower" aria-label="Slower">−</button><span id="speedv">1.0×</span><button class="chip" id="faster" aria-label="Faster">+</button>
    </div>
    <div class="group">
      <button class="chip" id="smaller" aria-label="Smaller text">A−</button><button class="chip" id="bigger" aria-label="Bigger text">A+</button>
    </div>
  </div>
  <div class="row">
    <div class="group">
      <button class="chip" id="editBtn">Script</button>
      <button class="chip" id="resetBtn" aria-label="Back to the top">Top</button>
    </div>
    <button id="recbtn" aria-label="Record"><i></i></button>
    <div class="group">
      <button class="chip" id="playBtn" aria-label="Start or pause the script">▶</button>
      <button class="chip" id="flipBtn" aria-label="Switch camera">Flip</button>
    </div>
  </div>
</div>

<section class="sheet" id="editor" hidden>
  <h2>Your script</h2>
  <p class="hint">One line per take. Blank lines are ignored. In Line mode, tap the script to move to the next line and swipe down to go back, so you can read each line 2–3 times.</p>
  <textarea id="script" spellcheck="true"></textarea>
  <div class="btns"><button class="btn primary" id="saveScript">Done</button><button class="btn" id="clearScript">Clear</button></div>
</section>

<section class="sheet" id="review" hidden>
  <h2>Take <span id="takeNo">1</span> · <span id="takeLen">0:00</span></h2>
  <video id="playback" playsinline controls></video>
  <p class="hint" id="saveHint">Save sends it to your Photos or Files. Send it to Claude to edit.</p>
  <div class="btns"><button class="btn primary" id="saveTake">Save video</button><button class="btn" id="discardTake">Record again</button></div>
</section>

<div id="err" hidden><div><b id="errT">Camera not available</b><span id="errM"></span></div></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('takeone.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('takeone.'+k,JSON.stringify(v))}catch(e){}}};

const SAMPLE=`I just taught AI to edit my videos like Roberto Nickson.
And no, it's not a template.
It watched 70 of the best reels on Instagram, frame by frame.
Every cut. Every caption. Every sound effect.
Roberto cuts every two seconds. Greg LaVecchia barely cuts at all.
So I recorded this once… and it edited the video you're watching right now.
Comment EDIT if you want to see how I set it up.`;

let script=store.get('script',SAMPLE), speed=store.get('speed',1), fs=store.get('fs',30), mode=store.get('mode','scroll');
let facing='user', stream=null, rec=null, chunks=[], recStart=0, timer=null, take=store.get('take',0), lastBlob=null, lastType='video/mp4';
let y=0, playing=false, raf=0, lastT=0, idx=0;

const cam=$('#cam'), scroller=$('#scroller'), viewport=$('#viewport');

function lines(){return script.split('\n').map(s=>s.trim()).filter(Boolean)}
function render(){
  scroller.innerHTML='';
  lines().forEach((t,i)=>{const p=document.createElement('p');const n=document.createElement('span');n.className='n';n.textContent=String(i+1).padStart(2,'0');p.append(n,document.createTextNode(t));scroller.append(p)});
  document.documentElement.style.setProperty('--fs',fs+'px');
  $('#speedv').textContent=speed.toFixed(1)+'×';
  $('#modeBtn').textContent=mode==='scroll'?'Scroll':'Line';
  $('#modeBtn').classList.toggle('on',mode==='line');
  layoutBand(); place(); highlight();
}
function layoutBand(){document.documentElement.style.setProperty('--bandh',Math.round(innerHeight*0.38)+'px')}
function cueY(){return viewport.clientHeight*0.28}
function place(){scroller.style.transform=`translateY(${(cueY()-y).toFixed(1)}px)`}
function highlight(){
  const ps=[...scroller.children]; if(!ps.length) return;
  if(mode==='line'){ps.forEach((p,i)=>p.classList.toggle('on',i===idx));return}
  let best=0; ps.forEach((p,i)=>{if(p.offsetTop<=y+fs*0.6) best=i}); ps.forEach((p,i)=>p.classList.toggle('on',i===best));
}
function goLine(i){const ps=scroller.children; idx=Math.max(0,Math.min(ps.length-1,i)); y=ps[idx]?ps[idx].offsetTop:0; place(); highlight()}
function tick(t){
  if(!playing){raf=0;return}
  const dt=lastT?(t-lastT)/1000:0; lastT=t;
  y+=dt*fs*1.15*speed; // ~1.15 text-heights per second at 1.0× ≈ conversational pace
  const max=scroller.scrollHeight-fs; if(y>=max){y=max; setPlay(false)}
  place(); highlight(); raf=requestAnimationFrame(tick);
}
function setPlay(v){
  if(mode==='line'){playing=false; $('#playBtn').textContent='▶'; return}
  playing=v; $('#playBtn').textContent=v?'❚❚':'▶'; lastT=0; if(v&&!raf) raf=requestAnimationFrame(tick);
}

/* camera */
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErr('Camera not available','Open this page in Safari or Chrome over an https:// link. Camera access is blocked for files opened directly from storage and inside some in-app browsers.');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920},frameRate:{ideal:30}},audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
    cam.srcObject=stream; cam.classList.toggle('back',facing!=='user'); $('#err').hidden=true;
  }catch(e){showErr('Camera blocked',"Allow camera and microphone for this site (Safari: aA › Website Settings), then reload. If you're inside Instagram or another app's browser, open the link in Safari instead.")}
}
function showErr(t,m){$('#errT').textContent=t;$('#errM').textContent=m;$('#err').hidden=false}

/* recording */
function pickType(){const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];for(const t of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)) return t}return ''}
async function countdown(){const el=$('#count');el.hidden=false;for(const n of [3,2,1]){el.textContent=n;await new Promise(r=>setTimeout(r,700))}el.hidden=true}
async function startRec(){
  if(!stream){await startCam(); if(!stream) return}
  if(!window.MediaRecorder){showErr('Recording not supported','This browser cannot record video. Update iOS or use Chrome.');return}
  await countdown();
  const type=pickType(); lastType=type.split(';')[0]||'video/mp4'; chunks=[];
  rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:8000000}:undefined);
  rec.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data)};
  rec.onstop=finishRec; rec.start(1000);
  recStart=Date.now(); $('#recbtn').classList.add('live'); $('#status').classList.add('live');
  timer=setInterval(()=>{$('#stxt').textContent='REC '+fmt((Date.now()-recStart)/1000)},250);
  if(mode==='scroll') setPlay(true);
  lockWake();
}
function stopRec(){if(rec&&rec.state!=='inactive') rec.stop(); setPlay(false)}
function finishRec(){
  clearInterval(timer); $('#recbtn').classList.remove('live'); $('#status').classList.remove('live'); $('#stxt').textContent='READY';
  lastBlob=new Blob(chunks,{type:lastType}); take+=1; store.set('take',take);
  $('#takeNo').textContent=take; $('#takeLen').textContent=fmt((Date.now()-recStart)/1000);
  $('#playback').src=URL.createObjectURL(lastBlob); $('#review').hidden=false;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function saveTake(){
  if(!lastBlob) return;
  const ext=lastType.includes('mp4')?'mp4':'webm'; const name=`take-${String(take).padStart(2,'0')}.${ext}`;
  const file=new File([lastBlob],name,{type:lastType});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}); return} }catch(e){ if(e&&e.name==='AbortError') return }
  const a=document.createElement('a'); a.href=URL.createObjectURL(lastBlob); a.download=name; document.body.append(a); a.click(); a.remove();
  $('#saveHint').textContent='Saved as '+name+' in your downloads.';
}

/* wake lock */
let wl=null; async function lockWake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') lockWake()});

/* controls */
$('#recbtn').onclick=()=>{rec&&rec.state==='recording'?stopRec():startRec()};
$('#playBtn').onclick=()=>setPlay(!playing);
$('#faster').onclick=()=>{speed=Math.min(3,+(speed+0.1).toFixed(1));store.set('speed',speed);render()};
$('#slower').onclick=()=>{speed=Math.max(0.3,+(speed-0.1).toFixed(1));store.set('speed',speed);render()};
$('#bigger').onclick=()=>{fs=Math.min(56,fs+3);store.set('fs',fs);render()};
$('#smaller').onclick=()=>{fs=Math.max(18,fs-3);store.set('fs',fs);render()};
$('#resetBtn').onclick=()=>{setPlay(false);idx=0;y=0;place();highlight()};
$('#modeBtn').onclick=()=>{mode=mode==='scroll'?'line':'scroll';store.set('mode',mode);setPlay(false);render();if(mode==='line')goLine(idx)};
$('#flipBtn').onclick=()=>{if(rec&&rec.state==='recording')return;facing=facing==='user'?'environment':'user';startCam()};
$('#editBtn').onclick=()=>{setPlay(false);$('#script').value=script;$('#editor').hidden=false};
$('#saveScript').onclick=()=>{script=$('#script').value;store.set('script',script);$('#editor').hidden=true;idx=0;y=0;render()};
$('#clearScript').onclick=()=>{$('#script').value='';$('#script').focus()};
$('#saveTake').onclick=saveTake;
$('#discardTake').onclick=()=>{$('#review').hidden=true;$('#playback').pause();$('#saveHint').textContent='Save sends it to your Photos or Files. Send it to Claude to edit.'};

/* tap / swipe on the script */
let sy=0, sx=0, moved=false;
viewport.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX;moved=false},{passive:true});
viewport.addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy; if(Math.abs(dy)>6){moved=true; if(mode==='scroll'){y=Math.max(0,y-dy);sy=e.touches[0].clientY;place();highlight()}} },{passive:true});
viewport.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;
  if(mode==='line'){ if(!moved) goLine(idx+1); else if(dy>40) goLine(idx-1); else if(dy<-40) goLine(idx+1); }
  else if(!moved) setPlay(!playing);
});
viewport.addEventListener('click',e=>{ if('ontouchstart' in window) return; mode==='line'?goLine(idx+1):setPlay(!playing) });
document.addEventListener('keydown',e=>{ if(!$('#editor').hidden) return;
  if(e.key===' '){e.preventDefault(); mode==='line'?goLine(idx+1):setPlay(!playing)}
  if(e.key==='ArrowDown') goLine(idx+1); if(e.key==='ArrowUp') goLine(idx-1); });
addEventListener('resize',()=>{layoutBand();place()});

render(); startCam();
})();
</script>
</body>
</html>
